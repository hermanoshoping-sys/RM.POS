title = "RM.POS Secret & Private Key Policy (Gitleaks)"

[extend]
useDefault = true

[[rules]]
id = "rmpos-pem-private-key"
description = "PEM-encoded EC, RSA, DSA, or PKCS#8 Private Key"
regex = '''-----BEGIN (?:EC |RSA |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'''
tags = ["key", "pem", "ecdsa", "critical"]

[[rules]]
id = "rmpos-pkcs8-ec-base64"
description = "Raw Base64 PKCS#8 P-256 Private Key (MIGHAgEAMBMGByqGSM49...)"
regex = '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEH[A-Za-z0-9+/=]{80,}'''
tags = ["key", "pkcs8", "ecdsa", "critical"]

[[rules]]
id = "rmpos-sec1-ec-base64"
description = "Raw Base64 SEC1 P-256 Private Key (MHcCAQEEI...)"
regex = '''MHcCAQEEI[A-Za-z0-9+/=]{60,}'''
tags = ["key", "sec1", "ecdsa", "critical"]

[[rules]]
id = "rmpos-hardcoded-test-private-key"
description = "Hardcoded TEST_PRIVATE_KEY or DEFAULT_MATCHING_PRIVATE_KEY constant"
regex = '''(?:TEST_PRIVATE_KEY|DEFAULT_MATCHING_PRIVATE_KEY_B64)\s*=\s*["'][A-Za-z0-9+/=]{40,}["']'''
tags = ["key", "test-leak", "critical"]

[[rules]]
id = "rmpos-release-keystore-file"
description = "Release keystore (.jks) inside repository"
path = '''\.jks$'''
tags = ["keystore", "android", "critical"]

[allowlist]
description = "Allow platform-managed debug.keystore.base64 and public key PEM"
paths = [
  '''^debug\.keystore\.base64$''',
  '''^license_public_key\.pem$''',
  '''^\.gitleaks\.toml$''',
  '''^tools/check_secrets_precommit\.py$'''
]
